Configuration:

  Properties:
    Property:
      - name: logpattern
        value: "%-5level %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} --%notEmpty{ [%notEmpty{node=%.-8X{node.pubkey}}%notEmpty{, bc-rid=%.-2X{blockchainRID}:%.4X{blockchainRID}}%notEmpty{, chain-id=%X{chainIID}}]:} %msg%n"

  Appenders:
    Console:
      - name: ConsoleAppender
        target: SYSTEM_OUT
        PatternLayout:
          pattern: ${logpattern}

  Loggers:

    Root:
      level: warn
      AppenderRef:
        - ref: ConsoleAppender

    Logger:

      - name: net.postchain
        level: debug
        additivity: false
        AppenderRef:
          - ref: ConsoleAppender
